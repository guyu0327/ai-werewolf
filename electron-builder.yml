appId: com.lixiao.aiwerewolf
productName: AIWerewolf
directories:
  output: dist
# 只打包壳代码；backend 源码副本与前端产物经 extraResources 放到安装目录（asar 内文件 Python 读不到）
files:
  - main.js
  - preload.js
  - boot.html
  - package.json
  - build/icon.png
extraResources:
  # 后端：优先 PyInstaller 产物（server.exe，目标机器免 Python），源码副本兜底（开发机有 Python 时也可跑）
  # 冻结态 main.py 的 PROJECT_ROOT=exe目录/.. 恰好指向 resources/，前端产物在 resources/web/dist
  - from: backend/dist/server
    to: server
  - from: backend
    to: server
    filter:
      - app/**
      - requirements.txt
  - from: web/dist
    to: web/dist
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
# 应用图标来自 build/icon.ico，经 rcedit 写入 exe（无签名证书，不会执行签名步骤）
nsis:
  # 向导式安装：用户可选安装位置（仍为按用户安装，不需要管理员权限）
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: ${name}-setup-${version}.${ext}
mac:
  # Mac 包必须在 macOS 上构建（PyInstaller 不能交叉编译，dist:mac 会先产出 mac 版 server 再打包）
  target: dmg
  category: public.app-category.games
  # 显式 ad-hoc 签名（不是「跳过签名」）。
  # 原因：arm64 上未签名的 App 会被内核直接拒绝启动；而 electron-builder 在找不到证书时
  # 默认「跳过签名」，产出的包在本机也打不开。ad-hoc 让 App 在任何 Mac 上都能通过
  # 「系统设置 → 隐私与安全性 → 仍要打开」放行，且不绑定构建机的证书/Apple ID。
  # 想要分发零提示，需 Apple Developer ID 证书（99 美元/年）+ 公证。
  identity: "-"
  # ad-hoc 签名下开启 hardenedRuntime 会启用库校验，Electron 框架与内置后端易被拦，
  # 关掉更稳（没走公证流程，hardened runtime 没有收益）
  hardenedRuntime: false
  extendInfo:
    # Electron 自带的是英文占位文案，系统麦克风授权弹窗会原样展示，这里换成中文
    NSMicrophoneUsageDescription: AI 狼人杀需要使用麦克风，把你的语音转写为发言文字。
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 不写 contents：electron-builder 默认就是「左边 app + 右边 Applications 快捷方式」的拖拽安装布局

